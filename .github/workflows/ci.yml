name: CI

on:
  # Run once per PR (on every push to its branch via `synchronize`), plus on
  # direct pushes to a default branch. Avoids duplicate runs for branch+PR.
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Typecheck (proxy)
        run: cd proxy && bunx tsc --noEmit

      - name: Test (policy engine, adapters, vault, pipeline, approvals)
        run: bun test

      - name: Build proxy binary
        run: cd proxy && bun run build

      - name: Build console
        run: cd console && bun run build
