name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # keyless signing via the job's OIDC identity — no stored key

# Third-party actions are pinned to full commit SHAs: this job publishes the
# binary users pipe into `sh`, so a moved tag upstream must not be able to
# change what ships. Artifacts are signed with cosign in keyless mode, which
# binds each signature to this workflow's OIDC identity rather than to a
# long-lived private key someone has to hold.

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: "linux-x64 linux-arm64"
          - os: macos-latest
            targets: "darwin-x64 darwin-arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      # --ignore-scripts: don't run dependency lifecycle scripts in the job that
      # publishes the binary users curl | sh.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Cross-compile binaries
        run: |
          cd proxy
          for t in ${{ matrix.targets }}; do
            os="${t%-*}"
            arch="${t##*-}"
            echo "building grenz-${t}"
            bun build ./src/index.ts --compile --target="bun-${os}-${arch}" --outfile "grenz-${t}"
            # Ad-hoc sign macOS binaries so Apple Silicon will run them.
            if [ "$os" = "darwin" ]; then
              codesign --sign - --force "grenz-${t}" || echo "codesign unavailable, skipping"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bins-${{ matrix.os }}
          path: proxy/grenz-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Generate checksums + stage installer
        run: |
          cd artifacts
          sha256sum grenz-* > SHA256SUMS.txt
          cp ../install.sh .
          echo "--- release assets ---" && ls -la
      # Sign the checksum file rather than each binary: it already commits to
      # every artifact, so one signature covers the set and verification is a
      # single command.
      - name: Sign the checksums (keyless)
        run: |
          cd artifacts
          COSIGN_YES=1 cosign sign-blob SHA256SUMS.txt \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/grenz-linux-x64
            artifacts/grenz-linux-arm64
            artifacts/grenz-darwin-x64
            artifacts/grenz-darwin-arm64
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.sig
            artifacts/SHA256SUMS.txt.pem
            artifacts/install.sh
          generate_release_notes: true
